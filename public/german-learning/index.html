<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e6d7bd">
  <title>Wortreise</title>
  <meta name="description" content="Wortreise: Deutsch lernen mit Karten, Lesen, Tests und Wiederholung.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23c2482a'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23f8f2e6' font-family='serif'%3E%E8%AA%9E%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Courier+Prime&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="scene" aria-hidden="true"><img id="sceneImg" alt=""></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header>
      <a class="mark" href="#heute"><span class="seal" aria-hidden="true">語</span><b>Wortreise</b></a>
      <nav id="nav" aria-label="Bereiche">
        <a href="#heute" data-route="heute">Heute</a>
        <a href="#lesen" data-route="lesen">Lesen</a>
        <a href="#karten" data-route="karten">Karten</a>
        <a href="#test" data-route="test">Test</a>
        <a href="#wiederholen" data-route="wiederholen">Wiederholen</a>
        <a href="#fortschritt" data-route="fortschritt">Fortschritt</a>
      </nav>
      <a class="gear" href="#einstellungen" data-route="einstellungen" title="Einstellungen" aria-label="Einstellungen">
        <span id="syncDot" class="sync-dot" aria-hidden="true"></span>⚙
      </a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="caption" id="caption">
    <span class="de" id="capDe"></span>
    <span class="en" id="capEn"></span>
    <span class="place"><span id="capPlace"></span><button id="shuffle" type="button" title="Andere Szene" aria-label="Andere Szene">↻</button></span>
  </div>

  <noscript><p style="padding:24px">Wortreise braucht JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
