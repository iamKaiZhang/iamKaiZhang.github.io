<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e6d7bd">
  <title>Wortreise</title>
  <meta name="description" content="Wortreise: Deutsch lernen mit Karten, Lesen, Tests und Wiederholung.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23c2482a'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23f8f2e6' font-family='serif'%3E%E8%AA%9E%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Courier+Prime&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="scene" aria-hidden="true"><img id="sceneImg" alt=""></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header>
      <a class="mark" href="#heute"><span class="seal" aria-hidden="true">語</span><b>Wortreise</b></a>
      <nav id="nav" aria-label="Bereiche">
        <a href="#heute" data-route="heute">Heute</a>
        <a href="#lesen" data-route="lesen">Lesen</a>
        <a href="#karten" data-route="karten">Karten</a>
        <a href="#test" data-route="test">Test</a>
        <a href="#wiederholen" data-route="wiederholen">Wiederholen</a>
        <a href="#fortschritt" data-route="fortschritt">Fortschritt</a>
      </nav>
      <a class="gear" href="#einstellungen" data-route="einstellungen" title="Einstellungen" aria-label="Einstellungen">
        <span id="syncDot" class="sync-dot" aria-hidden="true"></span><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18.83 10.47 L21.12 10.81 L21.12 13.19 L18.83 13.53 L17.91 15.75 L19.29 17.61 L17.61 19.29 L15.75 17.91 L13.53 18.83 L13.19 21.12 L10.81 21.12 L10.47 18.83 L8.25 17.91 L6.39 19.29 L4.71 17.61 L6.09 15.75 L5.17 13.53 L2.88 13.19 L2.88 10.81 L5.17 10.47 L6.09 8.25 L4.71 6.39 L6.39 4.71 L8.25 6.09 L10.47 5.17 L10.81 2.88 L13.19 2.88 L13.53 5.17 L15.75 6.09 L17.61 4.71 L19.29 6.39 L17.91 8.25 Z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="caption" id="caption">
    <span class="de" id="capDe"></span>
    <span class="en" id="capEn"></span>
    <span class="place"><span id="capPlace"></span><button id="shuffle" type="button" title="Andere Szene" aria-label="Andere Szene"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 5v4h-4"/></svg></button></span>
  </div>

  <noscript><p style="padding:24px">Wortreise braucht JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
